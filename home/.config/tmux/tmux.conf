set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",$TERM:RGB"
set -g mouse on
set-option -sg escape-time 10
set-option -g focus-events on

bind r source-file ~/.config/tmux/tmux.conf

# set -g status-left-style 'fg=white bg=black'
# set -g status-left '#{?client_prefix,#[fg=blue],#[fg=red]} '

set -g status-right-style 'fg=black bg=red bold'
set -g status-right '#[reverse]#[noreverse]%H:%M#[fg=red]#{?client_prefix,#[bg=yellow],#[bg=green]}#[fg=black]%d.%m.%Y#[reverse]#[noreverse]'

set -g status-style 'fg=green bg=black'

set -g window-status-current-style 'fg=black bg=green bold'
set -g window-status-current-format '#[reverse]#[noreverse]#I #W #F#[reverse]#[noreverse]'

#set -g window-status-separator ''
set -g window-status-separator ''
set -g window-status-style 'fg=green'
set -g window-status-format '#{s/-/#[fg=black]#[bg=yellow]/:window_flags}#I #[fg=white]#W #{s/-/#[fg=black]#[bg=yellow]/:window_flags}'
