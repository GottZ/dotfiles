# Kernel-Pointer nur für root sichtbar (KASLR-Schutz)
kernel.kptr_restrict=1

# io_uring komplett deaktivieren (historisch große Exploit-Fläche)
kernel.io_uring_disabled=2

# kexec deaktivieren (verhindert Kernel-Austausch zur Laufzeit)
kernel.kexec_load_disabled=1

# TTY Line Discipline Autoload deaktivieren (bekannter Exploit-Vektor)
dev.tty.ldisc_autoload=0

# BPF JIT Härtung für alle Prozesse
net.core.bpf_jit_harden=2

# Keine Core-Dumps von SUID-Binaries
fs.suid_dumpable=0

# Reverse Path Filtering (loose — kompatibel mit WireGuard-Routing)
net.ipv4.conf.all.rp_filter=2
net.ipv4.conf.default.rp_filter=2

# Martian-Pakete loggen
net.ipv4.conf.all.log_martians=1
net.ipv4.conf.default.log_martians=1

# IPv6 Redirects deaktivieren (IPv4 bereits in 99-routing.conf)
net.ipv6.conf.all.accept_redirects=0
net.ipv6.conf.default.accept_redirects=0

# IPv6 Router Advertisements deaktivieren (statische Konfiguration)
net.ipv6.conf.all.accept_ra=0
net.ipv6.conf.default.accept_ra=0
